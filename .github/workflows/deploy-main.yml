name: Deploy To AWS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_ACCESS_TOKEN_SECRET: ${{ secrets.JWT_ACCESS_TOKEN_SECRET }}
          JWT_REFRESH_TOKEN_SECRET: ${{ secrets.JWT_REFRESH_TOKEN_SECRET }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          envs: DATABASE_URL,JWT_ACCESS_TOKEN_SECRET,JWT_REFRESH_TOKEN_SECRET
          script: |
            set -e
            PROJECT_PATH="${{ secrets.EC2_PROJECT_PATH }}"
            if [ -z "$PROJECT_PATH" ]; then
              PROJECT_PATH="$HOME/6-sprint-mission"
            fi
            cd "$PROJECT_PATH"
            git fetch origin
            git checkout main
            git pull origin main
            DATABASE_URL="$DATABASE_URL" \
            JWT_ACCESS_TOKEN_SECRET="${JWT_ACCESS_TOKEN_SECRET:-change-me-access-secret}" \
            JWT_REFRESH_TOKEN_SECRET="${JWT_REFRESH_TOKEN_SECRET:-change-me-refresh-secret}" \
            docker compose -f docker-compose.yml down
            DATABASE_URL="$DATABASE_URL" \
            JWT_ACCESS_TOKEN_SECRET="${JWT_ACCESS_TOKEN_SECRET:-change-me-access-secret}" \
            JWT_REFRESH_TOKEN_SECRET="${JWT_REFRESH_TOKEN_SECRET:-change-me-refresh-secret}" \
            docker compose -f docker-compose.yml up -d --build
