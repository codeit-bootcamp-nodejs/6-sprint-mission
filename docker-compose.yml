name: mission11
services:
  server:
    image: mission11-image:1.0.0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_VERSION: 22-bullseye
      pull: true

    depends_on:
      - db

    container_name: mission11-container
    networks:
      - mission11-network
    environment:
      SERVER_PORT: 3000
      NODE_ENV: 'development'
      DATABASE_URL: 'postgresql://postgres:password@db:5432/mission11'
      AWS_BUCKET_NAME: 'MY_AWS_BUCKET_NAME'
      AWS_REGION: 'MY_AWS_REGION'
      AWS_ACCESS_KEY_ID: 'MY_AWS_ACCESS_KEY'
      AWS_SECRET_ACCESS_KEY: 'MY_AWS_SECRET_ACCESS_KEY'
    ports:
      - '3001:3000'
    volumes:
      - volume-mission11-uploads:/app/uploads:rw
      - volume-mission11-logs:/app/logs:rw

  db:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mission11
    networks:
      - mission11-network
    ports:
      - '5434:5432'
    volumes:
      - volume-mission11-db:/var/lib/postgresql/data

volumes:
  volume-mission11-uploads:
  volume-mission11-logs:
  volume-mission11-db:

networks:
  mission11-network:
